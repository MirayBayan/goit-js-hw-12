<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Homework 11</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <form class="search-form">
      <input type="text" name="searchQuery" placeholder="Search images..." />
      <button type="submit">Search</button>
    </form>
    <div class="loader-container is-hidden">
      <span class="loader"></span>
      <p>Yükleniyor...</p>
    </div>

    <ul class="gallery"></ul>
    <button type="button" class="load-more is-hidden">Load more</button>
    <p class="end-message is-hidden">
      We're sorry, but you've reached the end of search results
    </p>
    <script type="module" src="./main.js"></script>
  </body>
</html>
